[package]
name = "libbinder-basic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", optional = true }
enumflags2 = "0.7.12"
libbinder = { version = "0.1.0", path = "../../libbinder" }
libbinder-basic-macros = { version = "0.1.0", path = "../libbinder-basic-macros", optional = true }
serde = "1.0.229"
thiserror = "2.0.21"

[features]
default = ["bytemuck"]
bytemuck = ["dep:bytemuck"]
macros = ["dep:libbinder-basic-macros"]
